{# The host's notifications bell. Needs `openCount` (notifications waiting for a reply). #}
<a href="{{ url_for('notifications') }}"
   class="bell{% if request.endpoint == 'notifications' %} is-current{% endif %}"
   aria-label="Notifications{% if openCount %}, {{ openCount }} waiting{% endif %}" title="Notifications">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    </svg>
    {% if openCount %}<span class="bell-count">{{ '9+' if openCount > 9 else openCount }}</span>{% endif %}
</a>
